[project]
name = "agenteval-harness"
version = "0.1.0"
description = "Evaluation harness for RAG and tool-using AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15.0",
  "anthropic>=0.49.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "openai>=1.60.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["backend*"]
